name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `provenance: true` in package.json's publishConfig. npm
      # mints the attestation from this OIDC token, which is why a publish run
      # from a laptop fails no matter how the credentials are set up.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input needed: package.json carries `packageManager`.
      # Without that field this step fails with "No pnpm version is specified",
      # which is what silently broke the docs repo's update workflow.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check format, lint & types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      # npm mints the provenance attestation from this run's OIDC token and
      # then refuses the upload unless `repository.url` matches the repo's
      # canonical name. A GitHub rename redirect does not count, so a rename
      # breaks publishing silently until the next release. Two seconds here
      # beats finding out after the install, the build and the signature.
      - name: Check repository.url matches this repo
        run: |
          declared=$(node -p "require('./packages/cli/package.json').repository.url")
          expected="git+https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$declared" != "$expected" ]; then
            echo "::error::package.json repository.url is '$declared', but this repo is '$GITHUB_REPOSITORY'. npm provenance needs '$expected'."
            exit 1
          fi
          echo "repository.url matches $GITHUB_REPOSITORY"

      # Node 22 ships npm 10, which has no OIDC.
      - name: Update npm
        run: npm install -g npm@latest

      # pnpm packs, npm publishes: only npm reads `provenance` from publishConfig
      - name: Publish to npm
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"
          npm publish "$RUNNER_TEMP"/tarballs/*.tgz
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
