packages:
  - packages/*
  - apps/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# pnpm refuses to finish an install while a dependency's build script is
# neither allowed nor denied
allowBuilds:
  esbuild: true
  sharp: true
# our own packages, so the release-age wait buys nothing
minimumReleaseAgeExclude:
  - "@yummacss/*"
  - yummacss
  - geist@1.9.0
